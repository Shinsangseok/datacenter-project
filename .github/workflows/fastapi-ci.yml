name: FastAPI offline CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fastapi-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: FastAPI offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MODEL_SOURCE: local
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the approved FastAPI source and test set
        # Remote main predates this local candidate; missing sources must fail, not skip tests.
        shell: bash
        run: |
          set -euo pipefail
          for path in requirements.txt requirements-inference.txt backend/main.py \
            backend/model_loader.py backend/startup.py models/model.pkl \
            tests/test_analysis_context.py tests/test_app_schema.py \
            tests/test_fastapi_startup.py tests/test_model_loader.py \
            docs/examples/fastapi-dev-startup-probe.patch.yaml; do
            if [[ ! -f "$path" ]]; then
              printf 'Required CI input missing: %s\n' "$path" >&2
              exit 1
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-inference.txt
      - name: Install existing inference dependencies
        run: python -m pip install -r requirements-inference.txt
      - name: Parse Python sources without importing the application
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for root in (Path("backend"), Path("tests")):
              for path in sorted(root.rglob("*.py")):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Run scoped offline contracts (not the full suite)
        # unittest is built in; no pytest dependency or external integration credentials.
        # analysis_context installs the mocked model before importing backend.main.
        # Auth/Tracking baseline failures remain separate; no tests are marked xfail/skipped.
        run: |
          python -B - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "tests")
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "test_analysis_context",
              "test_app_schema",
              "test_fastapi_startup",
              "test_model_loader",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.testsRun > 0 and result.wasSuccessful() else 1)
          PY
