---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reviewed-gke-gfe
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-airflow
spec:
  podSelector:
    matchLabels:
      datacenter.gcp/component: airflow-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 35.191.0.0/16
    - ipBlock:
        cidr: 130.211.0.0/22
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reviewed-gke-gfe
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-app-dev
spec:
  podSelector:
    matchLabels:
      app: datacenter-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 35.191.0.0/16
    - ipBlock:
        cidr: 130.211.0.0/22
    ports:
    - protocol: TCP
      port: 8000
