---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gke-common-https
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-platform
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: '*.review-required.invalid'
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: gke-common-gateway-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            datacenter.gcp/owner: gke03a-common
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-airflow
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-airflow
spec:
  parentRefs:
  - name: gke-common-https
    namespace: datacenter-platform
    sectionName: https
  hostnames:
  - airflow.review-required.invalid
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gke-airflow-api
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-dev-api
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-app-dev
spec:
  parentRefs:
  - name: gke-common-https
    namespace: datacenter-platform
    sectionName: https
  hostnames:
  - api-dev.review-required.invalid
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: datacenter-api
      port: 8080
