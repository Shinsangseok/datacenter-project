      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gke-airflow-api
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-airflow
spec:
  type: ClusterIP
  selector:
    datacenter.gcp/component: airflow-api
  ports:
  - name: http
    port: 8080
    targetPort: http
