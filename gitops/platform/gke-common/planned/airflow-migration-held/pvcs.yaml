---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gke-airflow-dags-restored
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-airflow
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gke-common-retain-balanced
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gke-airflow-logs-restored
  labels:
    datacenter.gcp/owner: gke03a-common
  namespace: datacenter-airflow
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gke-common-retain-balanced
  resources:
    requests:
      storage: 20Gi
