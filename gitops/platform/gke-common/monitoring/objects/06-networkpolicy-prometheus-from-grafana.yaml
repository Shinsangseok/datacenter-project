apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    datacenter.gcp/owner: gke03c-monitoring
  name: prometheus-from-grafana
  namespace: datacenter-observability
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          datacenter.gcp/component: grafana
    ports:
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      datacenter.gcp/component: prometheus
  policyTypes:
  - Ingress
