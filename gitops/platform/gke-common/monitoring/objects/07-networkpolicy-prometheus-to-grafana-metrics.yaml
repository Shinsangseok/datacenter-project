apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    datacenter.gcp/owner: gke03c-monitoring
  name: prometheus-to-grafana-metrics
  namespace: datacenter-observability
spec:
  egress:
  - ports:
    - port: 3000
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          datacenter.gcp/component: grafana
  podSelector:
    matchLabels:
      datacenter.gcp/component: prometheus
  policyTypes:
  - Egress
