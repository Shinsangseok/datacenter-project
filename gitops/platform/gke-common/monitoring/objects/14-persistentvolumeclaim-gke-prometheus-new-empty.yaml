    helm.sh/resource-policy: keep
  labels:
    datacenter.gcp/owner: gke03c-monitoring
  name: gke-prometheus-new-empty
  namespace: datacenter-observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gke-common-retain-balanced
