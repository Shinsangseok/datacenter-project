apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    datacenter.gcp/owner: gke03c-monitoring
  name: grafana-to-prometheus
  namespace: datacenter-observability
spec:
  egress:
  - ports:
    - port: 9090
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          datacenter.gcp/component: prometheus
  podSelector:
    matchLabels:
      datacenter.gcp/component: grafana
  policyTypes:
  - Egress
