apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke03b-client-egress
  namespace: argocd
spec:
  egress:
  - ports:
    - port: 8081
      protocol: TCP
    to:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - repo-server
        matchLabels:
          app.kubernetes.io/instance: gke03b-argocd
          datacenter.gcp/bootstrap: gke-03b
  - ports:
    - port: 6379
      protocol: TCP
    to:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - redis
        matchLabels:
          app.kubernetes.io/instance: gke03b-argocd
          datacenter.gcp/bootstrap: gke-03b
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - application-controller
      - server
    matchLabels:
      app.kubernetes.io/instance: gke03b-argocd
      datacenter.gcp/bootstrap: gke-03b
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke03b-default-deny
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke03b-dns-egress
  namespace: argocd
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: node-local-dns
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: gke03b-argocd
      datacenter.gcp/bootstrap: gke-03b
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke03b-kubernetes-api-egress
  namespace: argocd
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 34.118.224.1/32
    - ipBlock:
        cidr: 10.20.0.2/32
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - application-controller
      - server
    matchLabels:
      app.kubernetes.io/instance: gke03b-argocd
      datacenter.gcp/bootstrap: gke-03b
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke03b-redis-ingress
  namespace: argocd
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - application-controller
          - server
          - repo-server
        matchLabels:
          app.kubernetes.io/instance: gke03b-argocd
          datacenter.gcp/bootstrap: gke-03b
    ports:
    - port: 6379
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - redis
    matchLabels:
      app.kubernetes.io/instance: gke03b-argocd
      datacenter.gcp/bootstrap: gke-03b
  policyTypes:
  - Ingress
---
