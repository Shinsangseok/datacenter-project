    helm.sh/chart: argo-cd-10.17.1
  name: gke03b-argocd-repo-server
  namespace: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: gke03b-argocd
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      annotations:
        checksum/cm: fb9c768f272940e997af913727ff58f176625ebbcbe642fa16715f547fd18b5f
        checksum/cmd-params: cd24f107c885311711d42544d3653b7b8b313357d33140391f266d17b5b61b62
      labels:
        app.kubernetes.io/component: repo-server
        app.kubernetes.io/instance: gke03b-argocd
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: argocd-repo-server
        app.kubernetes.io/part-of: argocd
        app.kubernetes.io/version: v3.6.1
        datacenter.gcp/bootstrap: gke-03b
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: argocd-repo-server
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/local/bin/argocd-repo-server
        - --port=8081
        - --metrics-port=8084
        - --redis-use-tls
        - --redis-ca-certificate=/app/config/redis-tls/ca.crt
        env:
        - name: GRPC_ENABLE_TXT_SERVICE_CONFIG
          valueFrom:
            configMapKeyRef:
              key: reposerver.grpc.enable.txt.service.config
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_REPO_SERVER_NAME
          value: gke03b-argocd-repo-server
        - name: ARGOCD_RECONCILIATION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              key: timeout.reconciliation
              name: argocd-cm
              optional: true
        - name: ARGOCD_REPO_SERVER_LOGFORMAT
          valueFrom:
            configMapKeyRef:
              key: reposerver.log.format
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_REPO_SERVER_LOGLEVEL
          valueFrom:
            configMapKeyRef:
              key: reposerver.log.level
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_LOG_FORMAT_TIMESTAMP
          valueFrom:
            configMapKeyRef:
              key: log.format.timestamp
              name: argocd-cmd-params-cm
              optional: true
