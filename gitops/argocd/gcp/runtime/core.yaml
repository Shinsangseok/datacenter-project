apiVersion: v1
data:
  redis_liveness.sh: "response=$(\n  redis-cli \\\n    -a \"${REDIS_PASSWORD}\" --no-auth-warning\
    \ \\\n    --tls --insecure \\\n    -h localhost \\\n    -p 6379 \\\n    ping\n\
    )\nif [ \"$response\" != \"PONG\" ] && [ \"${response:0:7}\" != \"LOADING\" ]\
    \ ; then\n  echo \"$response\"\n  exit 1\nfi\necho \"response=$response\"\n"
  redis_readiness.sh: "response=$(\n  redis-cli \\\n    -a \"${REDIS_PASSWORD}\" --no-auth-warning\
    \ \\\n    --tls --insecure \\\n    -h localhost \\\n    -p 6379 \\\n    ping\n\
    )\nif [ \"$response\" != \"PONG\" ] ; then\n  echo \"$response\"\n  exit 1\nfi\n\
    echo \"response=$response\"\n"
