apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datacenter-api-hpa
  namespace: datacenter-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datacenter-api

  minReplicas: 2
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
