apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlflow-dev
resources:
- ../../../base/mlflow
- ../../../base/rds-ca
- ../../../mlflow/auth
- migration.job.yaml
- bootstrap.job.yaml
patches:
- path: config.patch.yaml
- path: deployment.patch.yaml
configMapGenerator:
- name: mlflow-auth-policy
  files:
  - policy.json
  - checkpoints.json
