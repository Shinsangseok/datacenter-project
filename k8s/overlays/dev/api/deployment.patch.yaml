apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacenter-api
  namespace: datacenter-app
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: datacenter-api
        env:
        - name: DIFY_API_KEY
          $patch: delete
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: datacenter-api-config
              key: DB_NAME
