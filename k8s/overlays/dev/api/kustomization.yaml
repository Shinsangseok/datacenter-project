apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datacenter-app-dev
resources:
  - ../../../base/api
images:
  # Existing imported PROD image does not contain the DEV-aware loader yet.
  - name: datacenter-api
    newTag: dev-candidate-not-built
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: datacenter-api-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: datacenter-api-hpa
  - path: config.patch.yaml
  - path: deployment.patch.yaml
  - target:
      kind: Service
      name: datacenter-api
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
